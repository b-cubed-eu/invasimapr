url: https://b-cubed-eu.github.io/invasimapr/

template:
  math-rendering: mathjax
  bootstrap: 5
  bslib:
    bg: '#ffffff'
    fg: '#2f2f2f'
    heading_font:
      google: PT Sans
    primary: '#005856'

navbar:
  bg: primary
  type: dark
  structure:
    left:
    - intro
    - reference
    - articles
    - news
    right:
    - search
    - mainsite
    - github
  components:
    mainsite:
      icon: fa-cube
      href: https://b-cubed.eu/
      aria-label: B-Cubed website

articles:
  - title: "Getting started"
    navbar: ~
    contents:
      - invasimapr
  - title: "Tutorials"
    navbar: "Tutorials"
    contents:
      - articles/step-by-step-workflow
      - articles/clustering-and-risk-scenarios
      - articles/invasion-fitness-synthesis
      - articles/computing-invasion-fitness

reference:
  - title: "Overview of invasimapr functions"
    desc: |
      Quantifies and visualises invasion fitness from occurrence and trait data.
      Computes trait centrality, maps trait dispersion, and estimates interaction strength.
      Assesses site-level invasibility and community openness to new invasions.
      Produces interaction matrices and trait-specific invasion risk indicators.
      Aligns with Hui et al. (2016): integrates traits, propagule pressure, and environment.

  - title: "Wrapper functions"
    desc: Main pipeline functions, called in sequence.
    contents:
      - prepare_inputs
      - prepare_trait_space
      - model_residents
      - learn_sensitivities
      - predict_invaders
      - predict_establishment
      - summarise_results

  - title: "Core functions"
    desc: Building blocks used by the wrappers.
    contents:
      - get_trait_data
      - assemble_matrices
      - simulate_invaders
      - standardise_model_inputs
      - compute_trait_space
      - compute_centrality_hull
      - compute_resident_crowding
      - build_model_formula
      - prep_resident_glmm
      - standardise_by_site
      - compute_site_saturation
      - fit_auxiliary_residents_glmm
      - derive_sensitivities
      - site_varying_alpha_beta_gamma
      - build_invader_predictors
      - compute_invasion_fitness
      - compute_establishment_probability
      - summarise_invasiveness_invasibility

